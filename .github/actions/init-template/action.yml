name: Initialize the template
description: >
  Replaces the tokens of the template with the default values.
  Does nothing in a repository that the initializer already changed.

runs:
  using: composite
  steps:
    - name: Initialize the template
      shell: bash
      run: |
        if [ ! -f bin/init.mjs ]; then
          echo "No initializer. Skip."
          exit 0
        fi

        git config user.name "CI"
        git config user.email "ci@example.com"
        node bin/init.mjs < /dev/null
